<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Word Wise English–Vietnamese inline hint preview</title>
  <desc id="desc">A stylized KOReader page showing short definitions, horizontal rules and downward carets above difficult words.</desc>
  <rect width="1200" height="620" rx="28" fill="#ece9e1"/>
  <rect x="38" y="30" width="1124" height="560" rx="18" fill="#fbfaf6" stroke="#cbc6ba" stroke-width="3"/>
  <text x="82" y="82" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#34322f">WORD WISE · KOReader</text>
  <text x="1088" y="82" text-anchor="end" font-family="system-ui, sans-serif" font-size="17" fill="#77736a">English–Vietnamese</text>
  <g font-family="Georgia, serif" font-size="28" fill="#292824">
    <text x="82" y="180">Innovation often begins when an idea spreads beyond a single team.</text>
    <text x="82" y="290">A decentralized network can continue working without one central authority.</text>
    <text x="82" y="400">The system remains resilient because decisions are shared across many nodes.</text>
    <text x="82" y="510">Readers can understand difficult terms without leaving the current page.</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#3b3a36">
    <text x="182" y="123">new and innovative · mới và sáng tạo</text>
    <line x1="182" y1="137" x2="281" y2="137" stroke="#3b3a36" stroke-width="2"/>
    <line x1="297" y1="137" x2="471" y2="137" stroke="#3b3a36" stroke-width="2"/>
    <path d="M281 137 L289 145 L297 137" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <line x1="289" y1="145" x2="289" y2="157" stroke="#3b3a36" stroke-width="2"/>
    <text x="486" y="233">not controlled from one place · không do một nơi kiểm soát</text>
    <line x1="486" y1="247" x2="642" y2="247" stroke="#3b3a36" stroke-width="2"/>
    <line x1="658" y1="247" x2="910" y2="247" stroke="#3b3a36" stroke-width="2"/>
    <path d="M642 247 L650 255 L658 247" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <line x1="650" y1="255" x2="650" y2="267" stroke="#3b3a36" stroke-width="2"/>
    <text x="619" y="343">able to recover from problems · có khả năng phục hồi</text>
    <line x1="619" y1="357" x2="760" y2="357" stroke="#3b3a36" stroke-width="2"/>
    <line x1="776" y1="357" x2="1000" y2="357" stroke="#3b3a36" stroke-width="2"/>
    <path d="M760 357 L768 365 L776 357" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <line x1="768" y1="365" x2="768" y2="377" stroke="#3b3a36" stroke-width="2"/>
    <text x="683" y="453">the page now shown on screen · trang đang hiển thị</text>
    <line x1="683" y1="467" x2="811" y2="467" stroke="#3b3a36" stroke-width="2"/>
    <line x1="827" y1="467" x2="1048" y2="467" stroke="#3b3a36" stroke-width="2"/>
    <path d="M811 467 L819 475 L827 467" fill="none" stroke="#3b3a36" stroke-width="2"/>
    <line x1="819" y1="475" x2="819" y2="487" stroke="#3b3a36" stroke-width="2"/>
  </g>
  <text x="600" y="566" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#77736a">Short definitions stay attached to the exact word with a downward caret.</text>
</svg>
